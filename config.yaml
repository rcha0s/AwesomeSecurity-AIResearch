# ---------------------------------------------------------------------------
# Tunable configuration for the research analyzer. All magic numbers live here
# so scoring/behaviour can be tuned without touching code.
# ---------------------------------------------------------------------------

# Ranking weights — must sum to 1.0. Applied to the 0-100 score axes to produce
# each entry's composite score.
weights:
  newness: 0.25     # how recently the finding was published (time-decayed)
  novelty: 0.30     # how new the idea is versus what is already in the pool
  relevance: 0.30   # how useful/teachable it is for the track's audience
  credibility: 0.15 # authority of the source (its registry rank)

# HARD freshness window (days). We track only the latest research: anything
# whose source was published more than this many days ago is never ingested,
# and existing pool entries that age past it are pruned to data/archive.json
# (preserved, but no longer shown in the live tracker). "About a month."
max_age_days: 31

# How far back a DAILY scan ingests (days). The site still shows findings for
# max_age_days, but a scan only pulls what was published this week: older
# stories were covered by earlier scans, and re-reading them spends tokens on
# nothing new (Rohan, 2026-10-25). Claim work follows: a scan weighs this
# week's findings against the whole ledger. A backfill ignores this; its own
# window bounds it. Ad-hoc adds (add.py) keep max_age_days.
ingest_days: 7

# The README "this week" snapshot shows only curated findings published within
# this many days (the newsletter still covers the full max_age_days window).
snapshot_days: 7

# The site's front-page news lane ("Trending & in the news") shows stories
# published within this many days, newest first, at most this many. Every
# kept story stays on the site's News tab. Rohan, 2026-10-19.
news_front_page_days: 7
news_front_page_max: 30

# Emerging trends (scripts/trends.py). A tag's "recent" count is its dated
# findings inside max_age_days. Its baseline is the rate it ran at over the
# `baseline_days` before that window (shorter if the topic's history is), scaled
# to the window's length. A theme is `rising` only when its recent count is at
# least `rising_min_recent` AND above `rising_ratio` x that baseline; one with
# recent findings that is not rising is `steady`, one with none is `quiet`.
# Source, host and feed names are not themes: tags naming a registered source
# (its name, handle or site) are dropped, plus `exclude_tags`.
trends:
  baseline_days: 180
  rising_ratio: 1.0
  rising_min_recent: 2
  exclude_tags: [arxiv, ghsa, github, hn, hacker-news, nvd, cisa, kev, cisa-kev, rss, x, twitter, unit42, black-hat, def-con, defcon]

# Newness decay: newness = 100 * exp(-age_days / half_life_days).
# A finding loses half its newness score every `half_life_days` days. Kept short
# so ranking still differentiates within the ~1-month window.
half_life_days: 18

# Lessons/entries below this confidence (0-1) are flagged needs_review instead
# of being published to the public pool.
confidence_min: 0.55

# Curation gate — this pool is newsletter/education material for expert readers,
# so only genuinely NOVEL and RELEVANT findings publish as curated. Anything
# below these bars is kept but flagged needs_review (held from the vetted set),
# not dropped — a human can still promote it.
curation:
  min_novelty: 60      # derivative / well-known material scores below this
  min_relevance: 55    # must be directly useful to the track's expert audience
  min_composite: 20    # curated view floor — below this a finding stays in REVIEW.md,
                       # not the topic pages/newsletter (catches unscored/legacy noise)
  require_grounding: true  # a lesson excerpt that isn't found in the source ⇒ needs_review
                           # (protects the pool from hallucinated/paraphrased quotes)
  min_credibility: 45      # a low-authority source (registry rank below this) whose excerpts
                           # aren't grounded ⇒ needs_review (trust must be earned or verified)
  require_verification: true  # a finding the independent verifier pass REFUTED (verified=false)
                              # ⇒ needs_review. Un-verified (verified absent) is not penalized.

# Per-run caps (bound the cost of a single scan).
limits:
  article_chars: 20000  # truncate fetched article text to this many chars
  max_stories_per_run: 25 # DEEP tier: fully analyzed stories per scan (lessons,
                          # excerpts, verifier, readability). Rohan 2026-10-23: "get me
                          # something that works" -- 10 cut PHP2Shell, GitLab, PAN-OS.
                          # With max_news_per_run it sets each run's cost ceiling
                          # (scripts/budget.py); the guard refuses a run that no longer
                          # fits the month (a skipped day), it never overspends.
  max_news_per_run: 80    # NEWS tier (select_batch.py): every leftover candidate that
                          # is relevant news (a big-story group, a KEV / critical GHSA,
                          # or a severity / AI-incident marker from a source ranked
                          # batch_news_min_rank+) gets a short grounded brief instead of
                          # deep analysis. A runaway guard, not a quota: the 2026-10-23
                          # staged set (480 with the #102 feeds) had 38 news-tier stories
                          # past the 25 deep ones (48 once batch_news_min_rank was 40),
                          # so 50 binds on a busy day. 80 leaves a busy week room; at the
                          # 2026-10-22 rate ($0.209/unit) 31 cloud ceilings of
                          # 25 + 0.3 x 80 = 49 units come to $477 of the $600 cap
  batch_news_per_source: 15 # most news briefs one source may take, so one feed (or the
                            # KEV list) can't fill the tier alone. 15, not 4: The Hacker
                            # News is a wire, and on 2026-10-23 a cap of 4 cut its GPT-6
                            # agent, x402 and AI-agents-breach-1,200-sites stories (10
                            # still cut the last)
  brief_news_days: 60     # a GROUNDED news brief is kept like news (rerank never prunes it)
                          # for this many days, then moves to data/archive.json: off the
                          # News tab, still on the Archive tab. A held or ungrounded brief
                          # ages out at max_age_days like a finding. At up to 80 briefs a
                          # run, keeping every one forever would add ~2.4k entries a month
  batch_news_min_rank: 40 # source rank a single-source marker needs for a news brief.
                          # 40, not the lane's 55 (batch_story_min_rank): a brief is one
                          # grounded quote, not a lane slot, and The Register (49) and
                          # Dark Reading (40) carried 10-23's Cairn-abuse and AI-agent
                          # stories. GitHub/HN still never qualify on a marker
  batch_margin: 4         # extra candidates in the session's batch for ones the story
                          # judge finds same/update (scripts/select_batch.py)
  batch_per_source: 2     # most batch slots one source may take while others wait
  batch_priority_max: 4   # must-not-miss lane: new CISA KEV + critical GHSA (+ high GHSA
                          # in AI tooling) dealt right after the big-story lane; ~3 a day
                          # arrive (2026-W43: 8 KEV + 11 critical GHSA, 0 held by the
                          # pools). 4, not 5, since 2026-10-23: a KEV that is also the
                          # week's story now takes a story slot, and 3 of that day's 5
                          # lane picks were held ungrounded
  batch_priority_per_source: 3  # KEV is one source and GHSA one more: 3 + 2 fill the lane
  batch_class_slots:      # picks per round-robin round for a class (default 1). Plain
    rss: 2                # RSS is one class of 60+ feeds, 35% of staged candidates, and
                          # where the 12 tl;dr sec misses of W43 (of 31) were published
  batch_class_min:        # slots a class is guaranteed right after the must-not-miss lane
    curator: 1            # tl;dr sec curator links (ingest_curator_links.py); with
                          # batch_per_source 2, one or two reach every batch
  batch_routed_bonus: 5   # composite points for a confident prefilter domain hint
                          # (taxonomy confidence, not newsworthiness: a nudge only)
  batch_story_max: 4      # big-story lane, dealt first (newsworthy.py): one slot per
                          # story staged by 2+ independent sources with a severity or
                          # AI-incident marker. 2026-10-23: PHP2Shell came from 6 feeds
                          # and its best copy ranked 50th of 393; with the new feeds
                          # PHP2Shell, ARTEX, PAN-OS and GitLab fill it. Unused slots
                          # go to the deal
  batch_story_min_sources: 2   # ...with a marker (rce, critical, exploited, ...)
  batch_story_any_sources: 4   # ...or this many without one
  batch_story_days: 7     # a lane story was published in the last N days
  batch_story_min_rank: 55  # ...and one copy comes from outside GitHub/HN from a source
                          # ranked this or more (medium tier): two attacker repos, an HN
                          # vote or two low-rank feeds can't qualify on markers alone
  batch_lab_max: 6        # lab lane (select_batch.lab_lane), right after the must-not-miss
                          # lane: recent posts from the major AI labs (batch_lab_hosts) that
                          # name a security / safety term (batch_lab_terms). Rohan,
                          # 2026-10-24: prioritize OpenAI, Anthropic, Google and the other
                          # major AI research outlets. OpenAI's "Securing our frontier model
                          # training environment" ranked below the 29-slot cut: lab posts
                          # carry no severity marker. Leftover ones get a news brief
                          # (reason `lab`) instead of the backlog
  batch_lab_per_source: 2 # most lab-lane slots one source (feed) may take
  batch_lab_hosts:        # host (subdomains included) or host/path-prefix, no scheme
    - openai.com
    - anthropic.com
    - deepmind.google
    - research.google
    - blog.google/technology/ai
    - blog.google/technology/safety-security
    - security.googleblog.com
    - googleprojectzero.blogspot.com
    - ai.meta.com
    - microsoft.com/en-us/research
    - microsoft.com/en-us/security/blog
    - msrc.microsoft.com
    - deepmindsafetyresearch.medium.com
    - mistral.ai
    - huggingface.co/blog
    - developer.nvidia.com/blog
    - machinelearning.apple.com
    - amazon.science
    - x.ai
    - cohere.com/blog
  batch_lab_terms:        # a lab post needs one, as a whole word or phrase (plural s
                          # allowed) in title + excerpt: "security", not "securities"
    - security
    - secure
    - securing
    - cybersecurity
    - cyber
    - cyberattack
    - safety
    - safeguard
    - alignment
    - misuse
    - red team
    - red-team
    - red teaming
    - red-teaming
    - containment
    - sandbox
    - jailbreak
    - prompt injection
    - adversarial
    - backdoor
    - poisoning
    - exfiltration
    - vulnerability
    - vulnerabilities
    - exploit
    - exploitation
    - exploited
    - vulnerable
    - jailbroken
    - safeguarding
    - threat actor
    - threat intelligence
    - threat model
    - malicious
    - malware
    - guardrail
    - interpretability
    - preparedness
    - frontier risk
    - dangerous capabilities
    - evals
  batch_marker_bonus: 4   # deal score points for any severity / AI-incident marker
  batch_corroboration_bonus: 3  # ...plus this per extra source covering the story (max 3)
  max_turns: 360          # hard turn cap on the local model session. Sized for 25 deep
                          # + 80 news: ~4 turns a deep story (fetch, read, verifier, write)
                          # = 100, ~1.5 a brief (fetches batched, briefs written by
                          # subagents in tens) = 120, ~50 fixed (judge, taxonomy, claims,
                          # readability, merge, verify, editorial, summary): 270, x1.33
                          # headroom. Was 150 for 10 + margin 4.

# Spend guard (ISA ISC-8). A cloud routine can't read its credit balance, so the
# scan keeps a ledger on the `budget-ledger` branch, reserves each run's ceiling
# before any LLM work, and refuses once the month's spend reaches the cap. Runs
# read these values from origin/main, never from a working tree. Routines draw subscription usage first; usage
# credits only cover overage (routines.md § Usage and limits).
budget:
  monthly_cap_usd: 600        # Rohan 2026-10-23: don't worry about budget for now
                              # (was 100, Rohan 2026-10-19); null = every run skips LLM work
  usd_per_story: null         # null = the worst measured on recent local runs
  news_cost_ratio: 0.3        # one news brief costs this many deep stories (an estimate,
                              # recalibrated by the measured runs: budget.py prices a run
                              # in units = deep + 0.3 x news). From token counts: a deep
                              # story reads its source (~5k tokens) twice (analysis + the
                              # verifier subagent) plus ~2k of prompt and writes ~2k (in
                              # input-token terms, output x5: ~22k); a brief reads it once
                              # and writes ~300 (~6.5k): 6.5 / 22 = 0.3. Ceiling at the worst
                              # recent $0.4433/unit: 0.4433 x 1.5 x (25 + 0.3 x 80) = $32.65
                              # (the reservation; session_news_ratio sizes the session cap);
                              # at the latest $0.232/unit it is $17.05. A measured day (25 x $0.23 + 48 x $0.07 = $9.1)
                              # fits 31 a month in the $600 cap; 31 cloud runs charged the
                              # $32.65 ceiling would not (the guard then skips the last days).
  calibration_runs: 5         # "recent" = the last 5 measured runs, so the first run's
                              # 3-story $0.44/story doesn't price every run forever
  ceiling_headroom: 1.5       # ceiling = worst recent $/unit x 1.5 x units (see above): the
                              # session cap (x session_cap_fraction) must still clear a
                              # run as costly as the worst measured one
  uncalibrated_run_usd: 5     # what a first, uncalibrated local run reserves;
                              # null = it can't run either
  session_cap_fraction: 0.8   # local --max-budget-usd = session ceiling x this
                              # (spend can overshoot the cap, so leave headroom)
  session_news_ratio: 0.5     # the session cap prices a brief at this (pessimistic) ratio,
                              # not news_cost_ratio: a session stopped by its cap loses work.
                              # 0.4433 x 1.5 x (25 + 0.5 x 80) x 0.8 = $34.65; a 25 + 80 run
                              # costs 0.4433 x 65 = $28.82 at the worst recent rate and
                              # 0.232 x 65 = $15.08 at the latest, both under it
  retry_max_usd: 1.0          # a local run that failed analysis-empty and cost less
                              # than this may retry once the same day (budget.py)

# Backfill (issue #52; scripts/backfill.sh). A backfill chunk is a normal local
# scan whose ingest pulls items published inside [FROM, TO]. budget.py refuses
# any chunk outside this approved campaign window, over max_chunk_days, or
# overlapping a finished chunk, and caps the whole campaign: max_runs started,
# max_usd charged (each run's reserved ceiling counts until its measured cost
# replaces it). Backfill rows are never the day's scan. Rohan approved this
# campaign on 2026-10-22: ~40-50 stories, ~$10 measured. max_usd is the hard
# bound, not the expected spend. At the two-tier ceiling ($32.65 a run: worst
# recent $0.4433/unit x 1.5 x 49 units) 5 chunks reserve $163 before any is
# measured, so all 5 fit under 200; a 6th (the retry) fits once the first
# chunks' measured costs replace their reservations. Remove the block (or set
# null) to stop.
backfill:
  from: "2026-09-09"
  to: "2026-10-18"
  max_chunk_days: 10
  max_runs: 6           # 5 chunks of 8 days + one retry
  max_usd: 200          # Rohan 2026-10-23: don't worry about budget for now (was 16,
                        # which refused every chunk at the two-tier ceiling; 150 fit
                        # only 4 once max_news_per_run went to 80)

# Taxonomy proposals (ISA ISC-18). A verified `proposed_domain` that recurs on
# at least `proposal_min_count` entries within `proposal_window_days` opens (or
# comments on) a GitHub issue with this label. Vocabulary: data/taxonomy.yaml.
taxonomy:
  proposal_window_days: 30
  proposal_min_count: 3
  issue_label: taxonomy

# Gated auto-merge of claude/scan-* PRs (ISA ISC-27/28, .github/workflows/automerge.yml).
# The workflow reads this from main, never from the PR. Only content paths can
# merge (scripts/merge_guard.py); code, workflows, skills and config never do.
automerge:
  mode: shadow          # shadow = evaluate + report only; merge = actually merge.
                        # Flipping to merge is Rohan's call, recorded in ISA.md, once
                        # ISC-26's eval gate holds (shadow week first).
  merge_method: squash
  evals:                # Phase 3 hook (scripts/merge_gate.py). Missing scripts are
                        # skipped until `required: true`, then they fail closed.
    - script: scripts/eval_integrity.py
      required: true    # exists since Phase 3: a missing copy now fails the gate
    - script: scripts/eval_readability.py
      required: false   # report only: fails below readability.eval_min_pass (0 today)

# Story ledger (ISA ISC-19/20). data/news_stories.json is permanent: one row per
# story, never pruned. A new candidate is matched only against stories touched
# in the last `match_window_days`; the deterministic shortlist (tuned to
# over-match) hands at most `shortlist_max` of them to the small-model judge.
stories:
  match_window_days: 90
  shortlist_max: 5

# Phase 3 evals (ISA ISC-22..26): the reviewer nobody has to be. Each eval is a
# CLI that exits 0 on pass and prints one `EVAL <name> PASS|FAIL k=v ...` line,
# so a merge gate can run it. data/evals/history.json gets one row per scan;
# `eval_history.py gate` says whether the last `gate_runs` rows all pass, with
# integrity all-or-nothing.
evals:
  gate_runs: 7               # consecutive scan runs that must all pass
  max_result_age_days: 8     # a weekly recall/golden result older than this counts as missing
  thresholds:
    recall_min: 0.85         # share of on-thesis curator headlines we hold
    golden_min: 0.90         # share of golden cases the analyzer gets right
    off_topic_max: 0.10      # share of the analyzer's kept golden cases that are off-topic
    max_run_usd: null        # per-run cost cap; null = budget.monthly_cap_usd / 30
  recall:
    lookback_days: 7         # curator headlines published in the last N days
    tldrsec_max_issues: 2    # newest tl;dr sec issues by number (sitemap lastmod is an
                             # edit date, not a publish date; the page's own date decides)
  golden:
    min_fact_coverage: 0.5   # a kept case passes when at least this share of its facts appear
    cases_per_run: 8         # cases staged per weekly analyzer run (rotates through the set)
    max_usd: 4               # --max-budget-usd for the weekly golden analyzer session

# Readability of each brief's generated text (scripts/readability.py). Readers
# are senior security engineers who skim. Scored: title, takeaway, summary,
# lesson points, actionable title + detail; never the verbatim excerpts. Above
# `warn` is a mild issue (reported only); above `hold` is severe, and
# merge_analysis.py holds the entry in REVIEW.md ("readability: ...").
readability:
  thresholds:                              # calibrated 2026-10-22 on 444 briefs (pools + archive)
    sentence_words: {warn: 45, hold: 65}    # p50 35, p90 52, p95 57, max 85
    grade: {warn: 19, hold: 23}             # Flesch-Kincaid; p50 15.2, p90 18.9, max 25.9
    long_word_ratio: {warn: 0.33}           # mild only; p50 0.23, p95 0.34, max 0.45
    jargon_chain: {warn: 7}                 # mild only (no verb tagger); p50 6, p95 8, max 12
    acronyms: {warn: 3}                     # mild only; unexplained, distinct; p90 4, max 8
    hedges: {warn: 1, hold: 3}              # most in one sentence; 2+ is hedge-stacking
    banned: {warn: 0, hold: 2}              # filler/marketing phrases; any one is mild
    title_words: {warn: 18, hold: 24}       # p50 11, p90 17, max 25
    takeaway_sentences: {warn: 1, hold: 3}  # one clear sentence; p90 2
    takeaway_words: {warn: 45, hold: 65}    # p50 27, p90 47, max 71
    summary_sentences: {warn: 4, hold: 6}   # the skill asks for 2-3
  mild_cost: 8
  severe_cost: 25
  eval_min_pass: 0.0   # eval_readability.py fails below this share of published
                       # briefs passing; 0 = report only (optional eval for now)
  allow_acronyms: [AI, ML, LLM, LLMs, MCP, RAG, NLP, RL, RLHF, SFT, VLM, MLLM, GPT,
    API, APIs, SDK, CLI, IDE, CI, CD, PR, PRs, OSS, URL, HTTP, HTTPS, JSON, YAML, XML,
    HTML, CSS, JS, SQL, OS, VM, VMs, GPU, CPU, RAM, IP, ID, IDs, UI, UX, US, UK, EU,
    CVE, CVEs, CVSS, CWE, GHSA, KEV, NVD, CNA, CISA, NIST, OWASP, MITRE, ATT&CK, CERT,
    RCE, LPE, XSS, CSRF, SSRF, XXE, IDOR, LFI, RFI, SSTI, UAF, OOB, ROP, TOCTOU, ASLR,
    DEP, CFI, MTE, DNS, DNSSEC, TLS, SSL, SSH, SFTP, FTP, RDP, VNC, SMTP, IMAP, BGP,
    ARP, DHCP, VPN, VLAN, CDN, WAF, CSP, CORS, JWT, PKI, CA, OCSP, HSM, KMS, TPM, TEE,
    SGX, SEV, TDX, IAM, STS, MFA, SSO, OIDC, SAML, LDAP, LDAPS, NTLM, SMB, AD, ADCS, DC,
    GPO, LSASS, RBAC, ABAC, ACL, PII, PHI, HIPAA, GDPR, PCI, DSS, SOC, SIEM, SOAR, IDS,
    IPS, EDR, XDR, MDR, APT, IOC, IOCs, TTP, TTPs, OSINT, SBOM, SCA, SAST, DAST, SLSA,
    AWS, GCP, S3, EC2, EKS, GKE, AKS, GET, POST, PUT, USB, PDF]
  banned_phrases: [game-changer, game changer, groundbreaking, revolutionary,
    revolutionize, cutting-edge, cutting edge, state-of-the-art, best-in-class,
    next-generation, seamless, seamlessly, supercharge, unlock, unleash, empower,
    paradigm shift, holistic, synergy, delve, it's worth noting, it is worth noting,
    needless to say, in today's, ever-evolving, rapidly evolving landscape,
    a testament to, robust and scalable, leverage the power]
  hedges: [may, might, could, possibly, potentially, perhaps, likely, probably,
    arguably, somewhat, seemingly, apparently, presumably, appears, seems, suggests]
