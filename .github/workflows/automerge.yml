name: Auto-merge gate

# Gated auto-merge of claude/scan-* PRs (ISA ISC-27, ISC-28, Anti ISC-A3).
#
# Threat model: scan PRs are written by a model that reads attacker-controlled
# text. A prompt injection may change content; it must never change the pipeline.
# So a PR merges only if every changed path is content (scripts/merge_guard.py,
# the security boundary) and main's checks pass on the tree that would land.
#
# Trigger choice: schedule + workflow_dispatch, NOT pull_request_target or
# workflow_run.
#   - pull_request_target runs with a write token and secrets in the base
#     context; the classic "pwn request" is checking out the PR head there. It
#     also never fires for PRs opened with GITHUB_TOKEN (GitHub suppresses those
#     events), so render/scout-style bot PRs would be missed.
#   - workflow_run chained off Tests means consuming the outputs/artifacts of a
#     run that executed PR code: the second classic pitfall. And bot pushes'
#     pull_request runs wait at action_required (ISA Remaining Work).
#   - A scheduled run always uses main's workflow file and main's code, sees every
#     open PR however it was opened (the cloud routine's proxy pushes as the
#     owner, GITHUB_TOKEN PRs, the Mac runner), and nothing in a PR can choose
#     what runs. The cost is up to 30 minutes of latency.
#   Every job also refuses to run on any ref but main, so dispatching an old copy
#   of this file from a branch does nothing. (A branch that REWRITES this file
#   is out of reach of any workflow-level check; see AGENTS.md "Auto-merge".)
#
# Job split (no job both runs PR content and holds a write token):
#   select  read-only. Main's code evaluates every open claude/scan-* PR with
#           the path guard (git objects are fetched and diffed, never executed)
#           and picks the oldest that passes.
#   test    read-only (contents: read, no credentials persisted). Main merged
#           with that PR head, which by then is content-only; runs
#           scripts/merge_gate.py (pytest, ledger, http(s)-only URLs,
#           docs/index.html == main's renderer on its own payload,
#           docs/feed.xml == main's feed renderer on that payload, claim
#           history vs main, and the Phase 3 eval hook).
#           Its only input to `decide` is its pass/fail result.
#   decide  write. Checks out main only and runs main's code: re-fetches and
#           re-judges every PR (TOCTOU), reports each verdict, and in `merge`
#           mode merges the tested PR with sha=<tested head> so a moved head
#           gets a 409.
#
# Mode (shadow | merge) is `automerge.mode` in main's config.yaml. It ships as
# shadow: evaluate and report, never merge. No caches anywhere in this file: a
# cache written by a job that read untrusted input could poison a later one.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: automerge-gate
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pick.outputs.number }}
      sha: ${{ steps.pick.outputs.sha }}
      rebuild_number: ${{ steps.pick.outputs.rebuild_number }}
      rebuild_sha: ${{ steps.pick.outputs.rebuild_sha }}
      rebuild_ref: ${{ steps.pick.outputs.rebuild_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install main's dependencies
        run: pip install -r requirements.txt

      - name: Evaluate open scan PRs with the path guard
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automerge.py select --repo "$GITHUB_REPOSITORY" --main-sha "$GITHUB_SHA"

  test:
    needs: select
    if: github.ref == 'refs/heads/main' && needs.select.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the evaluated PR head into main (the tree that would land)
        env:
          NUMBER: ${{ needs.select.outputs.number }}
          SHA: ${{ needs.select.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "+refs/pull/$NUMBER/head:refs/pr/$NUMBER"
          [[ "$(git rev-parse "refs/pr/$NUMBER")" == "$SHA" ]] || {
            echo "PR head moved since select; not testing it"; exit 1; }
          git -c user.name=automerge-gate -c user.email=automerge-gate@invalid \
            merge --no-ff --no-edit "$SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # requirements.txt and every script are main's: the guard refused any PR
      # that touches them before this job could run.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # --base is main's commit: claim history is compared against git, not the tree.
      - name: Merge gate (pytest, ledger, URLs, render equality, claim history, evals)
        run: python scripts/merge_gate.py --base "$GITHUB_SHA"

  # A guard-passing scan PR that conflicts with main (two scan PRs from different
  # days both rewrite every generated file) is merged with main by code: a
  # three-way data merge plus main's renderers (scripts/rebuild_pr.py). The result
  # is pushed to the PR branch as a merge commit whose parents are main and the
  # tested head, so the push is a fast-forward and a moved head makes it fail. It
  # decides nothing: the next run judges the new head with the path guard and the
  # merge gate like any other. Only main's code runs; the PR supplies JSON only
  # (the guard already refused anything else). The token is in the push step only.
  rebuild:
    needs: select
    if: github.ref == 'refs/heads/main' && needs.select.outputs.rebuild_number != ''
    runs-on: ubuntu-latest
    environment: automerge
    permissions:
      contents: write # push the merge commit to the scan branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install main's dependencies
        run: pip install -r requirements.txt

      - name: Merge main into the PR head, resolving data by code
        env:
          NUMBER: ${{ needs.select.outputs.rebuild_number }}
          SHA: ${{ needs.select.outputs.rebuild_sha }}
          REF: ${{ needs.select.outputs.rebuild_ref }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REF" =~ ^claude/scan-[A-Za-z0-9._-]{1,100}$ ]]
          git fetch --no-tags origin "+refs/pull/$NUMBER/head:refs/pr/$NUMBER"
          [[ "$(git rev-parse "refs/pr/$NUMBER")" == "$SHA" ]] || {
            echo "PR head moved since select; not rebuilding it"; exit 1; }
          base="$(git merge-base "$GITHUB_SHA" "$SHA")"
          # Start from the PR head and merge main in, so the commit's first
          # parent is the head (the push is a fast-forward of the branch).
          git checkout -q --detach "$SHA"
          git -c user.name=automerge-gate -c user.email=automerge-gate@invalid \
            merge --no-ff --no-commit "$GITHUB_SHA" || true
          # The guard refused any PR touching the pipeline, so the merge takes
          # main's scripts and config; they now render the merged data.
          python scripts/rebuild_pr.py --base "$base" --ours "$GITHUB_SHA" --theirs "$SHA"
          git add -A -- data README.md NEWSLETTER.md TRENDS.md REVIEW.md \
            ai-security product-security ai-research claims docs
          [[ -z "$(git ls-files -u)" ]] || { echo "unresolved paths remain"; git ls-files -u | cut -f2 | sort -u; exit 1; }
          ! git grep -n -I -E '^(<<<<<<<|>>>>>>>) ' -- data README.md NEWSLETTER.md TRENDS.md REVIEW.md ai-security product-security ai-research claims docs
          git -c user.name=automerge-gate -c user.email=automerge-gate@invalid \
            commit -q -m "chore: merge main into $REF (rebuilt by code)" \
            -m "Data merged three ways by scripts/rebuild_pr.py; site re-rendered by main's renderers."
          [[ "$(git rev-parse HEAD^1)" == "$SHA" && "$(git rev-parse HEAD^2)" == "$GITHUB_SHA" ]]

      - name: Push the rebuilt head (fast-forward only)
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ needs.select.outputs.rebuild_ref }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$REF"

  decide:
    needs: [select, test]
    if: always() && github.ref == 'refs/heads/main' && needs.select.result == 'success'
    runs-on: ubuntu-latest
    # Deployment branch policy: only main may run in this Environment, so a job
    # from any other ref that names it is refused before it starts.
    environment: automerge
    permissions:
      contents: write # merge, update-branch
      pull-requests: write # merge, verdict comments
      actions: write # dispatch tests.yml (required check) and update.yml after a merge
      pages: write # request a Pages build: GITHUB_TOKEN pushes don't start one
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install main's dependencies
        run: pip install -r requirements.txt

      - name: Re-check, report, and (merge mode only) merge
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.select.outputs.number }}
          SHA: ${{ needs.select.outputs.sha }}
          TESTS: ${{ needs.test.result }}
        run: >-
          python scripts/automerge.py decide --repo "$GITHUB_REPOSITORY"
          --main-sha "$GITHUB_SHA" --number "$NUMBER" --sha "$SHA" --tests "$TESTS"
