name: Source scout

# Daily discovery of trending publishers we don't already ingest from.
# Writes proposals to data/source_proposals.json and opens a PR against
# main. A human merges (or ignores + optionally blocklists the domain).
#
# HN top-of-window trending only for the first cut — Reddit / Google News /
# X are drop-in extensions to scripts/source_scout.py:_hn_trending style.

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily — before the Monday render at 06:00
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write # ensure_pr.sh dispatches tests.yml onto the bot branch

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run source_scout
        run: python scripts/source_scout.py

      # The branch is rebuilt from the current origin/main on every run, so
      # its diff holds only this run's change. Never reuse the old tip: a
      # stale base reverts unrelated files (PR #98). The push is a
      # force-with-lease pinned to the remote sha read just before.
      - name: Open or refresh proposals PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_PROFILE: source-scout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # No drift → nothing to PR.
          if [[ -z "$(git status --porcelain data/source_proposals.json)" ]]; then
            echo "No new proposals; nothing to PR."
            exit 0
          fi

          branch="chore/source-proposals"
          git fetch origin main
          # The scout ran against this checkout. If main moved since, the
          # proposals were computed on stale data: skip; tomorrow's run redoes it.
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::warning::main moved during the run; skipping so the PR is not built on a stale base."
            exit 0
          fi
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"

          git checkout -B "$branch" origin/main
          git add data/source_proposals.json
          git commit -m "chore: source proposals ($(date -u +%Y-%m-%d))"
          scripts/guard_bot_diff.sh source-scout
          git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"

          scripts/ensure_pr.sh "$branch" \
            "chore: source proposals ($(date -u +%Y-%m-%d))" \
            "Automated source-scout run. Review data/source_proposals.json; merge to accept, close + \`scripts/remove_source.py <id> --blocklist\` if a proposal is wrong."
