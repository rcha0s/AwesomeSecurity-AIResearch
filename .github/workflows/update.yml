name: Render research site

# Keeps the rendered knowledge base in sync with the data pools. This job does
# NOT do LLM analysis or Twitter ingestion (those run locally via the
# /research-scan + /add-resource skills — datacenter IPs risk the X account).
# It re-ranks the committed pools (time-decayed newness re-sorts them as findings
# age) and regenerates README.md, the security/ and ai/ trees, and the ledger,
# committing any drift as a PR against protected main.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC (refreshes decayed ranking)
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - "scripts/**"
      - "config.yaml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write # ensure_pr.sh dispatches tests.yml onto the bot branch

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Never publish from a broken generator: the suite gates the render.
      - name: Run tests
        run: pytest -q

      - name: Re-rank pools
        run: python scripts/rerank.py

      # Fails the run on a broken supersession edge rather than publishing a
      # ledger where a retired claim points at nothing.
      - name: Validate the claim ledger
        run: python scripts/add_claim.py validate

      - name: Regenerate site + claims + trends + newsletter + review + card
        run: |
          python scripts/generate_site.py
          python scripts/generate_claims.py
          python scripts/generate_html.py
          python scripts/generate_og.py
          python scripts/trends.py
          python scripts/generate_newsletter.py
          python scripts/generate_review.py

      # docs/og.png is drawn with the runner's fonts, so it can differ from the
      # committed card even with identical inputs. It is a pure function of the
      # data, so it only counts as drift when something else changed.
      - name: Discard og.png-only drift
        run: |
          if [[ -z "$(git status --porcelain -- . ':!docs/og.png')" ]]; then
            git checkout -- docs/og.png
          fi

      # main is branch-protected (PRs required), so the bot cannot push
      # directly. Stage the render drift onto a dedicated branch and open /
      # refresh a PR — humans merge once CI is green.
      - name: Open or refresh render-refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_PROFILE: render-refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One shared list: also what scripts/guard_bot_diff.sh permits.
          paths=()
          while IFS= read -r p; do
            [[ -z "$p" || "$p" == \#* ]] && continue
            paths+=("$p")
          done < scripts/bot_paths/render-refresh.txt

          # Scope the drift check to what gets staged: drift elsewhere would
          # pass this check and then fail `git commit` with nothing staged.
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "No render drift; nothing to PR."
            exit 0
          fi

          branch="chore/render-refresh"
          git fetch origin main
          # Render ran against this checkout. If main moved since, the output
          # is stale: skip (the push-to-main trigger re-runs on the new head).
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::warning::main moved during the run; skipping so the PR is not built on a stale base."
            exit 0
          fi
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"

          # Rebuilt from the current origin/main every run, never the old tip
          # (a stale base reverts unrelated files, PR #98). The lease is pinned
          # to the remote sha just read, so it never rejects for "stale info".
          git checkout -B "$branch" origin/main
          git add "${paths[@]}"
          git commit -m "chore: render refresh ($(date -u +%Y-%m-%d))"
          scripts/guard_bot_diff.sh render-refresh
          git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"

          scripts/ensure_pr.sh "$branch" \
            "chore: render refresh ($(date -u +%Y-%m-%d))" \
            "Automated regeneration of the site, claims, trends, newsletter, review, and skill artifacts. Green CI = safe to merge."
