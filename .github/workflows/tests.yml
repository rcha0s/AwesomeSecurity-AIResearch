name: Tests

# Runs the suite on every pull request. Before this, tests only ran inside the
# Monday render job on main, so a broken suite went unseen for weeks. This is
# also the check scan-PR auto-merge will gate on. Lint (ruff/black) joins once
# the repo-wide formatting pass lands — main is not lint-clean yet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q
