name: Tests

# Runs the suite on every pull request. Before this, tests only ran inside the
# Monday render job on main, so a broken suite went unseen for weeks. This is
# also the check scan-PR auto-merge will gate on. Lint (ruff/black) joins once
# the repo-wide formatting pass lands — main is not lint-clean yet.

on:
  # main is already gated by update.yml's pytest step on push.
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      # ISC-24: deterministic integrity of the pools and the rendered site
      # (grounded quotes, article citations, taxonomy IDs, http(s) URLs, no
      # duplicate stories). No network, no LLM.
      - name: Integrity eval
        run: python scripts/eval_integrity.py --verbose

      - name: Golden set is well-formed
        run: python scripts/eval_golden.py check
