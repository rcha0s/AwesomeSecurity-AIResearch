# ---------------------------------------------------------------------------
# Curated, credible source feeds for AwesomeSecurity-AIResearch.
#
# Only first-party security researchers, vendors with dedicated research teams,
# standards bodies, and peer-reviewed venues are included. News aggregators are
# intentionally excluded to keep signal high and provenance clear.
#
# Each feed is tagged with the domain(s) it most often covers. The aggregator
# still classifies every item independently by keyword, so a feed tagged
# "AI Security" can still contribute a Web or Mobile item.
# ---------------------------------------------------------------------------

# The freshness windows live in config.yaml: `ingest_days` (7) is how far back
# a daily scan's ingestors reach, `max_age_days` (31) how long the site shows a
# finding before pruning it. We track only the latest research.

# LinkedIn is auth-walled; ad-hoc adds fall back to pasted text/file. Handled
# by scripts/add.py, not the batch aggregator.
linkedin:
  note: "Use `python scripts/add.py <url>`; if the fetch is blocked, paste with --text/--file."

# ---------------------------------------------------------------------------
# GitHub trending/novel repo discovery (via `gh search repos`). Surfaces new
# security research, tools, vulns, and patterns. Needs `gh` authed.
# Novelty is judged at analysis time; well-known/old repos score low and are
# held as needs_review by the curation gate.
# ---------------------------------------------------------------------------
github:
  min_stars: 40          # ignore repos below this (noise floor)
  per_query: 8           # top-N per query by stars (created within config max_age_days)
  # Search queries and watched users now live in the ranked registry
  # (data/sources.json, type: github_query / github_user) — add with
  # `python scripts/add_source.py github_query "<query>"` or `github_user <name>`.

# ---------------------------------------------------------------------------
# Hacker News discovery (via the keyless Algolia API). A velocity signal: it
# surfaces a wave breaking hours-to-days before it reaches a curated feed. Only
# stories that keyword-match a topic AND clear the points floor are staged;
# novelty/curation is judged at analysis time. Network only.
# ---------------------------------------------------------------------------
hackernews:
  min_points: 40        # keyword-search story score floor (noise gate)
  per_query: 6          # top-N per keyword query

  # Top-stories tap — pull every high-scoring HN story regardless of keyword,
  # then let the shared topic classifier drop off-topic ones. Catches the
  # story that trends before anyone's written a keyword-matching post about
  # it. Standalone news floor: NEWS_HN_STANDALONE_MIN_POINTS in common.py.
  top_stories: true
  top_stories_min_points: 100
  top_stories_per_run: 30

  queries:
    - "prompt injection"
    - "LLM security"
    - "MCP server"
    - "AI agent security"
    - "supply chain attack"
    - "npm malware"

# ---------------------------------------------------------------------------
# Curator links (scripts/ingest_curator_links.py). tl;dr sec links the week's
# best security research, much of it on small blogs with no feed of their own.
# Its public issue pages are read (via tldrsec.com/sitemap.xml) and each linked
# story is staged with the ARTICLE as its citation. Paywalled hosts are never
# staged, so they are never fetched; archive mirrors are paywall bypasses.
curator_links:
  max_issues: 2         # the newest N issues by issue number (weekly, so 2 ~ 14 days).
                        # Never by sitemap lastmod: it is an edit date (an old issue
                        # can carry a recent one; most share a 2025-04 bulk touch).
  lookback_days: 14     # of those, only issues whose own publish date is this recent
  # Credibility of a staged link (registry-rank scale). The linked blog is usually
  # unknown to the registry; tl;dr sec vouching for it lifts it above the neutral 50
  # and the 45 min_credibility bar, but below tl;dr sec's own 80: the curator
  # picked it, it did not write it.
  source_rank: 70
  paywall_hosts:
    - nytimes.com
    - wsj.com
    - ft.com
    - bloomberg.com
    - theinformation.com
    - economist.com
    - washingtonpost.com
    - theatlantic.com
    - businessinsider.com
    - link.springer.com
    - sciencedirect.com
    - ieeexplore.ieee.org
    - dl.acm.org
    - archive.is
    - archive.ph
    - archive.today

# ---------------------------------------------------------------------------
# Peer-reviewed conference discovery (via the free, keyless arXiv API).
# These venues publish no usable feed and some sit behind paywalls we never
# touch; authors record acceptance in the arXiv `comments` field, so we search
# that instead and always land on a free full text. Only ACCEPTED work is
# staged ("submitted to X" is filtered out) and each item must still classify
# on-topic, so venue acceptance alone can't drag in the whole ML firehose.
# Black Hat and DEF CON are NOT here - they are not on arXiv and still need
# their own archive scraper.
conferences:
  per_venue: 20         # top-N newest per venue before the freshness cut
  # Dedicated security venues: everything accepted here is in scope.
  venues:
    - "USENIX Security"
    - "NDSS"
    - "SaTML"
    - "AISec"
    - "CCS"
    - "IEEE S&P"
    - "IEEE Symposium on Security and Privacy"
  # General ML/SE venues. These are firehoses that publish mostly off-thesis
  # work, so an item must ALSO match a `security_terms` keyword to be staged -
  # that keeps the adversarial-ML papers and drops the object-detection ones.
  broad_venues:
    - "NeurIPS"
    - "ICML"
    - "ISSTA"
  security_terms:
    - adversarial
    - jailbreak
    - backdoor
    - poisoning
    - prompt injection
    - membership inference
    - model extraction
    - model stealing
    - watermark
    - unlearning
    - privacy attack
    - data leakage
    - exfiltration
    - malicious
    - vulnerability
    - exploit
    - insecure
    - security
    - attack
    - threat
    - defense
    - robustness
    - red team
    - guardrail
    - safety alignment

# ---------------------------------------------------------------------------
# GitHub Advisory Database (GHSA) discovery (via authed `gh api /advisories`).
# Human-reviewed supply-chain disclosures — the dependency/package attack
# surface an appsec reader must track. Needs `gh` authed.
# ---------------------------------------------------------------------------
ghsa:
  enabled: true
  per_run: 20           # newest reviewed advisories to pull per run (any severity)
  # Plus the newest critical ones, always. GitHub reviews ~50 advisories a day,
  # so the newest 20 can be one project's batch (2026-10-21: 20 Pillow) while
  # that week's critical ones go unseen. ~2 critical a day: 30 spans two weeks.
  per_run_critical: 30

