# GitHub Pages config — publishes the repo's markdown as a browsable site.
#
# Enable once in the repo: Settings → Pages → Source: "Deploy from a branch",
# branch `main`, folder `/ (root)`. Nothing else to run; Pages rebuilds on push.
#
# The markdown IS the site: README.md becomes the landing page, and the
# generated claims/ and topic directories become sub-pages. jekyll-relative-links
# rewrites the in-repo `.md` links so the same files work on GitHub and on Pages.

title: Awesome Security & AI Research
description: >-
  An auto-updating, source-cited tracker of AI-security and practitioner AI research —
  plus a claim ledger recording what we currently believe, what it replaced, and why.
theme: jekyll-theme-cayman

# All three are on by default for GitHub Pages; listed explicitly so a local
# `bundle exec jekyll serve` behaves the same as production.
plugins:
  - jekyll-relative-links       # ../claims/ai-research.md -> the rendered page
  - jekyll-optional-front-matter # render .md files that have no YAML front matter
  - jekyll-titles-from-headings  # page title comes from its first H1

relative_links:
  enabled: true
  collections: true

# Source, data, and tooling are not part of the published site.
exclude:
  - scripts/
  - tests/
  - data/
  - evals/
  - .claude/
  - .github/
  - requirements.txt
  - pyproject.toml
  - AGENTS.md
  - PUBLISH.md
