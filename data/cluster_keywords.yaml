# Deterministic keyword hints for the 13-cluster taxonomy in interests.yaml.
#
# This file is the KEYWORD SHORTCUT. The LLM still owns the reasoning call
# (per interests.yaml's header note). The prefilter (scripts/prefilter.py)
# uses these lists to route the obvious cases deterministically and let the
# LLM focus on the ambiguous middle band.
#
# Rules of thumb when editing:
#   - Prefer multi-word phrases over single tokens ("prompt injection" beats
#     "prompt"). Single tokens fire too often on unrelated arXiv text.
#   - A candidate scores a cluster by how many of its keywords hit the
#     lowercased title + summary + guess_domain haystack. Higher wins; ties
#     kick the item into the "filtered" bucket for the LLM.
#   - Add sparingly. False-positives here mean the LLM never sees an item.
#     The tests (tests/test_prefilter.py) guard the ambiguity threshold.

